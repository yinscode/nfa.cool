[package]
name = "nfa-registry"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy"] }
near-contract-standards = { path = "../../vendor/near-contract-standards-5.30.1" }
serde_json = "=1.0.154"
sha3 = "=0.10.8"
bs58 = "=0.5.1"

[build-dependencies]
# Hashes the embedded vault once at build time (runtime hashing cost ~12 TGas per call).
sha2 = "=0.11.1"
