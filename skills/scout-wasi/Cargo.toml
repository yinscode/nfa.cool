[package]
name = "nfa-scout-wasi"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(target_os = "wasi")'.dependencies]
wit-bindgen = "0.51"
wasi-http-client = "=0.2.1"

[dev-dependencies]
wit-parser = "=0.244.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
